[package]
name = "asaas"
description = "An SDK for interacting with the Asaas API."
version = "0.1.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/wuzi/asaas"
readme = "README.md"
keywords = ["sdk", "payments", "asaas"]
categories = ["network-programming"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_with = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
